services:
  proxy:
    image: ghcr.io/cbehl-updater/example-proxy:1.0.0
    deploy:
      replicas: ${REPLICAS_PROXY:-0}
    ports:
      - "6562:80"

  frontend:
    image: ghcr.io/cbehl-updater/example-frontend:1.0.0
    deploy:
      replicas: ${REPLICAS_FRONTEND:-0}
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ghcr.io/cbehl-updater/example-api:1.0.0
    deploy:
      replicas: ${REPLICAS_API:-0}
    environment:
      DATABASE_URL: "postgresql://app:app@db:5432/app"
      HTTP_PORT: "3000"
      APP_VERSION: "1.3.0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    image: ghcr.io/cbehl-updater/example-worker:1.4.0
    deploy:
      replicas: ${REPLICAS_WORKER:-0}
    environment:
      DATABASE_URL: "postgresql://app:app@db:5432/app"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    deploy:
      replicas: ${REPLICAS_DB:-0}
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db-data:
